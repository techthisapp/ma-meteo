<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- La politique de sécurité du contenu, audit du 1er octobre 2026, constat
     2.5 : les scripts ne viennent que du site, les appels et les images que
     des sources recensées. Un échappement oublié ne pourrait plus lancer de
     code. Les styles en ligne restent permis : plusieurs gabarits posent un
     attribut style, et un style injecté ne lance rien. GitHub Pages ne sert pas
     d'en-tête de politique : la balise est la seule voie, et elle ne connaît
     ni frame-ancestors ni les rapports. Toute source nouvelle s'ajoute ici ; un
     contrôle le vérifie. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://tilecache.rainviewer.com https://view.eumetsat.int https://maps.effis.emergency.copernicus.eu https://data.atmo-france.org https://api.meteofrance.fr; connect-src 'self' https://api.open-meteo.com https://ensemble-api.open-meteo.com https://archive-api.open-meteo.com https://air-quality-api.open-meteo.com https://marine-api.open-meteo.com https://webservice.meteofrance.com https://api.vigieau.gouv.fr https://regleau.s3.gra.perf.cloud.ovh.net https://hubeau.eaufrance.fr https://router.project-osrm.org https://geo.api.gouv.fr https://api-adresse.data.gouv.fr https://api.rainviewer.com https://data.atmo-france.org https://view.eumetsat.int https://api.meteofrance.fr; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F14" media="(prefers-color-scheme: dark)">
<meta name="description" content="Prévision heure par heure et à seize jours, pluie dans l'heure, vigilance Météo-France, ciel et carte.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ma météo">
<title>Ma météo</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icones/icone-180.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<a class="saut" href="#ecran">Aller au contenu</a>

<!-- Couche navigation : barre de tête en matière verre, titre compact au défilement -->
<header class="nav" id="nav">
  <div class="nav-corps">
    <button type="button" class="nav-lieu" id="navLieu" data-feuille="communes"
            aria-label="Changer de commune">
      <span class="nav-pos" id="navPos" hidden aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8.4"/>
          <path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3"/>
        </svg>
      </span>
      <!-- La commune, et sous elle son département, jalon 11, lot 4 : les deux
           lignes tiennent dans la cible de 44 points du bouton. -->
      <span class="nav-noms"><span id="navLieuNom">Ma météo</span><span class="nav-dep" id="navLieuDep" hidden></span></span>
      <svg class="nav-chev" viewBox="0 0 24 24" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9.5l6 6 6-6"/>
      </svg>
    </button>
    <!-- Le jeton du rappel de parapluie. Il ne paraît que s'il y a lieu, à la
         même place sur les cinq écrans, entre la commune et les réglages. -->
    <button type="button" class="nav-jeton" id="navJeton" data-feuille="parapluie" hidden>
      <span id="navJetonIco" aria-hidden="true"></span>
      <span id="navJetonTxt"></span>
    </button>
    <button type="button" class="nav-act" id="btnReglages" aria-label="Réglages">
      <!-- Un engrenage, demande de Jérôme du 3 octobre 2026 : le soleil
           d'avant se confondait avec le temps qu'il fait. -->
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linejoin="round">
        <path d="M18.89 9.89 L21.24 10.28 L21.24 13.72 L18.89 14.11 L18.36 15.38 L19.75 17.32 L17.32 19.75 L15.38 18.36 L14.11 18.89 L13.72 21.24 L10.28 21.24 L9.89 18.89 L8.62 18.36 L6.68 19.75 L4.25 17.32 L5.64 15.38 L5.11 14.11 L2.76 13.72 L2.76 10.28 L5.11 9.89 L5.64 8.62 L4.25 6.68 L6.68 4.25 L8.62 5.64 L9.89 5.11 L10.28 2.76 L13.72 2.76 L14.11 5.11 L15.38 5.64 L17.32 4.25 L19.75 6.68 L18.36 8.62Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
  <!-- La consultation d'un lieu touché sur la carte, jalon 19, lot 4 : le lieu
       consulté n'entre pas dans la liste ; le bandeau dit lequel, et propose de
       le suivre ou de revenir au lieu d'avant. -->
  <div class="nav-consult" id="navConsult" hidden>
    <span class="titre-lu" id="navConsultTxt"></span>
    <button type="button" class="nc-b" id="navSuivre">Suivre ce lieu</button>
    <button type="button" class="nc-b nc-revenir" id="navRevenir">Revenir</button>
  </div>
</header>

<!-- Couche contenu -->
<main id="ecran" tabindex="-1"></main>

<!-- Couche navigation : barre d'onglets -->
<nav class="onglets" id="onglets" aria-label="Sections"></nav>

<!-- Couche superposition -->
<div class="voile" id="voile" hidden></div>

<section class="feuille" id="feuille" role="dialog" aria-modal="true" aria-labelledby="feuille-titre" tabindex="-1" hidden>
  <div class="feuille-poignee" aria-hidden="true"><i></i></div>
  <div class="feuille-tete">
    <button type="button" class="feuille-retour" id="feuille-retour" hidden aria-label="Revenir">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5l-7 7 7 7"/>
      </svg>
    </button>
    <h2 id="feuille-titre"></h2>
    <span class="feuille-action" id="feuille-action"></span>
    <button type="button" class="feuille-fermer" id="feuille-fermer" aria-label="Fermer">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>
  <div class="feuille-corps" id="feuille-corps"></div>
</section>

<p class="etat" id="etat" aria-hidden="true" hidden></p>
<p class="titre-lu" id="annonce" role="status" aria-live="polite"></p>
<p class="titre-lu" id="alerte" role="alert"></p>

<script type="module" src="./src/app.js"></script>
</body>
</html>
